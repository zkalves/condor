<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-wing-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Border -->
  <rect width="512" height="512" rx="100" fill="url(#grad-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Geometric DAG Grid Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4,4">
    <line x1="256" y1="90" x2="100" y2="240" />
    <line x1="256" y1="90" x2="412" y2="240" />
    <line x1="100" y1="240" x2="180" y2="390" />
    <line x1="412" y1="240" x2="332" y2="390" />
    <line x1="180" y1="390" x2="256" y2="430" />
    <line x1="332" y1="390" x2="256" y2="430" />
    <line x1="256" y1="90" x2="256" y2="430" />
  </g>

  <!-- DAG Nodes -->
  <circle cx="256" cy="90" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="100" cy="240" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="412" cy="240" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="180" cy="390" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="332" cy="390" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="430" r="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Left Wing -->
  <path d="M 256 180 L 100 150 L 50 210 L 130 240 L 60 290 L 160 300 L 90 350 L 210 330 L 256 360 Z"
        fill="url(#grad-wing-left)" filter="url(#glow)"/>

  <!-- Right Wing -->
  <path d="M 256 180 L 412 150 L 462 210 L 382 240 L 452 290 L 352 300 L 422 350 L 302 330 L 256 360 Z"
        fill="url(#grad-wing-right)" filter="url(#glow)"/>

  <!-- Central Head & Body (Soaring Condor) -->
  <path d="M 256 120 L 274 165 L 285 240 L 256 370 L 227 240 L 238 165 Z" fill="url(#grad-core)"/>
  <polygon points="256,95 264,125 248,125" fill="#f8fafc"/>
  <polygon points="256,90 262,110 250,110" fill="#e0f2fe"/>
</svg>
