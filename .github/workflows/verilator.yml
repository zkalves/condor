name: Verilator EDA Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-verilator:
    name: Verilator ALU Simulation (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: standard
            cmd: "make run-verilator"
            check_coverage: false
          - mode: coverage
            cmd: "make run-verilator-coverage"
            check_coverage: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Verilator and Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            git \
            verilator \
            perl \
            python3 \
            zlib1g-dev \
            libfl2 \
            libfl-dev

      - name: Verify Verilator Installation
        run: verilator --version

      - name: Build Condor
        run: |
          cmake -B build -S . -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Execute Verilator Pipeline (${{ matrix.mode }})
        run: |
          ${{ matrix.cmd }}

      - name: Validate Coverage File Contract in test_metrics.yaml
        run: |
          LATEST_RUN=$(ls -td condor_runs/* | head -n 1)
          echo "Inspecting latest run: $LATEST_RUN"
          SAMPLE_METRICS="$LATEST_RUN/stages/sim_tests/0001/test_metrics.yaml"
          cat "$SAMPLE_METRICS"

          if [ "${{ matrix.check_coverage }}" = "true" ]; then
            echo "Checking that coverage_file exists in metrics..."
            grep -q "coverage_file:" "$SAMPLE_METRICS"
            grep -q "coverage_enabled: true" "$SAMPLE_METRICS"
          else
            echo "Checking that coverage_file is NOT in metrics when coverage is disabled..."
            if grep -q "coverage_file:" "$SAMPLE_METRICS"; then
              echo "ERROR: coverage_file was unexpectedly emitted when coverage is disabled!" >&2
              exit 1
            fi
            grep -q "coverage_enabled: false" "$SAMPLE_METRICS"
          fi

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verilator-run-${{ matrix.mode }}
          path: condor_runs/
