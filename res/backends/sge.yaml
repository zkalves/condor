name: sge
type: template
description: "Grid Engine Family (Sun Grid Engine / Altair Grid Engine / Open Grid Scheduler)"
submit_command: "qsub -terse {script}"
poll_command: "qstat -j {grid_id}"
cancel_command: "qdel {grid_id}"
job_id_regex: "([0-9]+)"
success_pattern: "COMPLETED|FINISHED"
failure_pattern: "Eqw|FAILED|ERROR|ABORTED"
running_pattern: "qw|hqw|r|t|s|dr"
empty_poll_means_done: true
