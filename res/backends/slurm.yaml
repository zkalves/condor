name: slurm
type: template
description: "Slurm Workload Manager"
submit_command: "sbatch --parsable {script}"
poll_command: "squeue -j {grid_id} -h -o %T"
cancel_command: "scancel {grid_id}"
job_id_regex: "([0-9]+)"
success_pattern: "COMPLETED"
failure_pattern: "FAILED|CANCELLED|TIMEOUT|NODE_FAIL|PREEMPTED|BOOT_FAIL|DEADLINE|OUT_OF_MEMORY"
running_pattern: "PENDING|RUNNING|SUSPENDED|CONFIGURING|COMPLETING"
empty_poll_means_done: true
