name: pbs
type: template
description: "PBS Professional (Portable Batch System)"
submit_command: "qsub {script}"
poll_command: "qstat -x {grid_id}"
cancel_command: "qdel {grid_id}"
job_id_regex: "([0-9]+(\\.[a-zA-Z0-9_-]+)?)"
success_pattern: "job_state = F|job_state = C|COMPLETED"
failure_pattern: "FAILED|CANCELLED"
running_pattern: "job_state = R|job_state = Q|job_state = E|job_state = H|RUNNING|QUEUED"
empty_poll_means_done: true
