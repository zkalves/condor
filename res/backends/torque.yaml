name: torque
type: template
description: "TORQUE Resource Manager (PBS-derivative)"
submit_command: "qsub {script}"
poll_command: "qstat {grid_id}"
cancel_command: "qdel {grid_id}"
job_id_regex: "([0-9]+(\\.[a-zA-Z0-9_-]+)?)"
success_pattern: "C|COMPLETED"
failure_pattern: "E|FAILED"
running_pattern: "R|Q|H|W|T|RUNNING|QUEUED"
empty_poll_means_done: true
