name: simple_pipeline

variables:
  arch: "x86_64"
  build_type: "Release"

settings:
  max_parallel_jobs: 4
  base_output_dir: "./condor_runs"
  on_failure_action: "abort"
  status_interval_sec: 10
  output_mode: "all"

stages:
  - name: build
    jobs:
      - name: compile_app
        command: "bash ${CONDOR_PIPELINE_DIR}/build.sh"

  - name: test
    depends_on: [build]
    jobs:
      - name: unit_tests
        command: "bash ${CONDOR_PIPELINE_DIR}/test.sh"
      - name: integration_tests
        command: "bash ${CONDOR_PIPELINE_DIR}/test.sh"

  - name: package
    depends_on: [test]
    jobs:
      - name: package_app
        command: "bash ${CONDOR_PIPELINE_DIR}/package.sh"
