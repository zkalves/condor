name: conditional_pipeline

variables:
  coverage: "0"
  fast_mode: "1"

settings:
  max_parallel_jobs: 4
  base_output_dir: "./condor_runs"
  on_failure_action: "continue"
  output_mode: "all"

stages:
  - name: build
    jobs:
      - name: compile
        command: "bash ${CONDOR_PIPELINE_DIR}/build.sh"

  - name: quick_check
    depends_on: [build]
    enabled_if: "${fast_mode} == '1'"
    jobs:
      - name: smoke_check
        command: "bash ${CONDOR_PIPELINE_DIR}/smoke_check.sh"

  - name: heavy_coverage
    depends_on: [build]
    enabled_if: "${coverage} == '1'"
    jobs:
      - name: coverage_check
        command: "bash ${CONDOR_PIPELINE_DIR}/coverage_check.sh"

  - name: report
    depends_on: [quick_check, heavy_coverage]
    jobs:
      - name: generate_report
        command: "bash ${CONDOR_PIPELINE_DIR}/report.sh"
