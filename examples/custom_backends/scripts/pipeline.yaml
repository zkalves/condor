name: custom_backends_pipeline

variables:
  cluster_queue: "batch_standard"

settings:
  max_parallel_jobs: 4
  base_output_dir: "./condor_runs"
  backend: "grid_cluster"

# Define custom template backends (e.g. Slurm, SGE, LSF, or container orchestrators)
backends:
  grid_cluster:
    type: template
    submit_command: "bash ${CONDOR_PIPELINE_DIR}/mock_grid_submit.sh {script} {job_id}"
    poll_command: "bash ${CONDOR_PIPELINE_DIR}/mock_grid_poll.sh {grid_id}"
    cancel_command: "bash ${CONDOR_PIPELINE_DIR}/mock_grid_cancel.sh {grid_id}"

stages:
  # Stage 1 runs on the default 'local' backend
  - name: prepare
    jobs:
      - name: setup_environment
        command: "echo '[LOCAL] Initializing workspace and configuration...'"
      - name: stage_inputs
        command: "echo '[LOCAL] Staging input data matrices...'"

  # Stage 2 executes on the configured grid_cluster backend
  - name: distributed_compute
    depends_on: [prepare]
    jobs:
      - name: matrix_partition_0
        command: "bash ${CONDOR_PIPELINE_DIR}/workload.sh"
        depends_on: ["prepare/0002"]       # Job-level dependency on stage_inputs
      - name: matrix_partition_1
        command: "bash ${CONDOR_PIPELINE_DIR}/workload.sh"
        depends_on: ["prepare/0002"]
      - name: sanity_probe
        command: "echo '[GRID] Performing sanity check on cluster worker slot...'"

  # Stage 3 aggregates results locally
  - name: finalize
    depends_on: [distributed_compute]
    jobs:
      - name: finalize_pipeline
        command: "echo '[LOCAL] All grid cluster tasks successfully completed. Pipeline finalized.'"
